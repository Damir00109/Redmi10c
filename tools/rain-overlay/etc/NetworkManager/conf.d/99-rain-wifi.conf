# System-side constraints so stock (unpatched) NetworkManager can own Wi-Fi
# on rain/fog without patching NM sources.
[main]
plugins=keyfile
dns=default
no-auto-default=*
rc-manager=unmanaged

[connectivity]
# HTTP connectivity checks cause extra route/DNS churn on fragile stacks
enabled=false
interval=0

[device]
wifi.backend=wpa_supplicant
wifi.scan-rand-mac-address=no

# ath10k_snoc: never randomize MAC / never powersave during scan/assoc
[device-rain-snoc]
match-device=driver:ath10k_snoc
wifi.scan-rand-mac-address=no
wifi.mac-address-randomization=0

[connection]
wifi.powersave=2
wifi.mac-address-randomization=never
ipv6.method=disabled

[keyfile]
# Keep USB gadget / loopbacks out of NM. gsm/cdma excluded via
# 10-globally-managed-devices.conf override (wifi only).
unmanaged-devices=interface-name:usb0;interface-name:rndis0;interface-name:ttyGS0;interface-name:lo;interface-name:dummy0
