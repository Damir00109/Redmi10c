# Stable Ubuntu dual-boot on rain/fog — no auto WiFi/modem drivers.
# Load manually via: sudo qcom-wifi-start.sh (uses insmod, bypasses blacklist)
blacklist ath10k_snoc
blacklist ath10k_core
blacklist ath10k_pci
blacklist ath10k_sdio
blacklist sh366101_fg_bringup
blacklist smb1351_charger_bringup
# Prevent accidental reload of builtin duplicates if stale .ko reappear
blacklist qrtr
blacklist qrtr_smd
blacklist qmi_helpers
blacklist qcom_q6v5_pas
blacklist qcom_sysmon
blacklist mdt_loader
