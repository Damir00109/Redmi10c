<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Let our SSC sensor bridge own the name desktops look for.  The bridge
     re-publishes the Snapdragon Sensor Core sensors (they live on the ADSP,
     so there are no kernel IIO devices for iio-sensor-proxy to use). -->
<busconfig>
  <policy user="root">
    <allow own="net.hadess.SensorProxy"/>
    <allow send_destination="net.hadess.SensorProxy"/>
  </policy>
  <policy context="default">
    <allow send_destination="net.hadess.SensorProxy"/>
    <allow receive_sender="net.hadess.SensorProxy"/>
  </policy>
</busconfig>
